<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Métadonnées par défaut. La page courante les met à jour au chargement
      (voir lib/seo.js) : le titre et la description d'une fiche produit
      doivent décrire ce produit, pas la boutique entière.
    -->
    <title>Click & Collect</title>
    <meta name="description" content="Click & Collect : le catalogue de la boutique Action, à retirer en magasin." />
    <meta property="og:site_name" content="Click & Collect" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />

    <link rel="stylesheet" href="/src/global.css" />

    <!--
      Application du thème avant le premier affichage. Script ordinaire et non
      module : le navigateur l'exécute avant de dessiner la page, qui
      n'apparaît donc jamais, même brièvement, dans le mauvais thème.
      Le thème est conservé en localStorage : le serveur n'en a pas besoin.
    -->
    <script>
      try {
        if (localStorage.getItem("theme") === "sombre") {
          document.documentElement.classList.add("theme-dark");
        }
      } catch (e) {
        // localStorage indisponible : on reste en thème clair.
      }
    </script>
  </head>
  <body class="bg-white text-zinc-950 antialiased dark:bg-zinc-950 dark:text-zinc-50">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
