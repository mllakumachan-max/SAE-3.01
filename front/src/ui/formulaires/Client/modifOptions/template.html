<section class="mb-6 rounded-lg border border-zinc-200 bg-white p-6 shadow-xs dark:border-zinc-800 dark:bg-zinc-900">
  <div class="mb-4 flex items-center justify-between">
    <h2 class="text-2xl font-semibold tracking-tight text-zinc-950 dark:text-zinc-50">Modifier les options</h2>
    <button type="button" data-action="fermer" aria-label="Fermer" class="flex h-8 w-8 items-center justify-center rounded-md border border-zinc-200 text-zinc-500 hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-400 dark:hover:bg-zinc-800">
      <svg class="h-4 w-4 shrink-0" aria-hidden="true">
        <use href="#icon-x" />
      </svg>
    </button>
  </div>
  <p class="mb-5 text-sm text-zinc-500 dark:text-zinc-400">{{nom}}</p>

  <form class="flex flex-col gap-4">
    <div data-zone="message"></div>
    <div data-zone="options" class="flex flex-col gap-4"></div>

    <div class="mt-2 flex justify-end gap-3">
      <button type="button" data-action="fermer" class="h-10 rounded-md border border-zinc-200 px-4 text-sm font-medium text-zinc-700 hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-200 dark:hover:bg-zinc-800">
        Annuler
      </button>
      <button type="submit" class="h-10 rounded-md bg-zinc-900 px-4 text-sm font-medium text-white hover:opacity-90 dark:bg-zinc-50 dark:text-zinc-900">
        Enregistrer
      </button>
    </div>
  </form>
</section>
