<section role="dialog" aria-modal="true" aria-labelledby="titre-annulation" class="mb-6 rounded-lg border border-zinc-200 bg-white p-6 shadow-xs dark:border-zinc-800 dark:bg-zinc-900">
    <h2 id="titre-annulation" class="mb-2 text-xl font-semibold text-zinc-950 dark:text-zinc-50">Annuler la commande n° {{numero}} ?</h2>
    <p class="mb-5 text-sm text-zinc-600 dark:text-zinc-300">Les produits de cette commande seront remis en stock. Cette action est irréversible.</p>
    <div class="flex justify-end gap-3">
        <button type="button" data-action="fermer" class="h-10 rounded-md border border-zinc-200 px-4 text-sm font-medium text-zinc-700 hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-200 dark:hover:bg-zinc-800">Retour</button>
        <button type="button" data-action="confirmer" class="h-10 rounded-md bg-red-700 px-4 text-sm font-medium text-white hover:opacity-90 dark:bg-red-500">Annuler la commande</button>
    </div>
</section>
