<header class="sticky top-0 z-10 border-b border-zinc-200 bg-white shadow-xs dark:border-zinc-800 dark:bg-zinc-950">
  <!-- Ligne principale : Logo, Recherche, Actions utilisateur -->
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-6 px-6 py-3.5">
    <div class="flex items-center gap-8">
      <a href="/" data-link class="flex items-center gap-2">
        <img src="{{logo-src}}" alt="Logo de l'application" class="h-5 w-auto" />
        <span class="hidden text-xs font-medium text-zinc-500 sm:inline dark:text-zinc-400">Click & Collect</span>
      </a>
    </div>

    <!-- Actions à droite : Thème, Compte, Panier -->
    <div class="flex items-center gap-3">
      <button type="button" data-action="theme" aria-label="Changer de thème" class="flex h-9 items-center justify-center rounded-md border border-zinc-200 px-3 text-xs font-medium text-zinc-700 transition-colors hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-800">
        <svg class="h-4 w-4 shrink-0" aria-hidden="true">
          <use href="{{icon-theme}}" />
        </svg>
      </button>

      <a href="/admin" data-link class="flex h-9 items-center rounded-md border border-zinc-200 px-3 text-xs font-medium text-zinc-700 transition-colors hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-800">
        <span>Administration</span>
      </a>

      <a href="/compte" data-link class="flex h-9 items-center gap-1.5 rounded-md border border-zinc-200 px-3 text-xs font-medium text-zinc-700 transition-colors hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-800">
        <svg class="h-4 w-4 shrink-0" aria-hidden="true">
          <use href="#icon-user-circle" />
        </svg>
        <span>Mon compte</span>
      </a>

      <!-- Bouton Panier avec compteur d'articles (CMD-b) -->
      <a href="/panier" data-link class="relative flex h-9 items-center gap-2 rounded-md bg-blue-600 px-3.5 text-xs font-semibold text-white transition-opacity hover:opacity-90">
        <svg class="h-4 w-4 shrink-0" aria-hidden="true">
          <use href="#icon-shopping-bag" />
        </svg>
        <span>Panier</span>
        <span data-role="compteur-panier" class="flex h-5 min-w-5 items-center justify-center rounded-full bg-white px-1 text-[11px] font-bold text-blue-600">
          {{nbArticles}}
        </span>
      </a>
    </div>
  </div>

  <!-- Barre de catégories (DEC-a) -->
  <div class="border-t border-zinc-100 bg-zinc-50/80 px-6 py-2 dark:border-zinc-800 dark:bg-zinc-900/50">
    <nav class="mx-auto flex max-w-6xl items-center gap-6 overflow-x-auto text-sm">
      <a href="/" data-link class="font-medium text-zinc-900 hover:text-blue-600 aria-[current=page]:text-blue-600 dark:text-zinc-100 dark:hover:text-blue-400 dark:aria-[current=page]:text-blue-400">
        Tous les produits
      </a>
      <slot name="categories"></slot>
    </nav>
  </div>
</header>
