<header class="sticky top-0 z-10 border-b border-zinc-200 bg-white/95 backdrop-blur-xs dark:border-zinc-800 dark:bg-zinc-950/95">
  <figure class="flex flex-col mx-auto max-w-6xl items-center justify-between gap-6 px-6 py-3">
    <div class="flex w-full justify-between items-center gap-3">
      <a href="/admin" data-link class="flex items-center gap-2 text-sm font-bold tracking-tight text-zinc-950 dark:text-zinc-50">
        <img src="{{logo-src}}" alt="Logo de l'application" class="h-5 w-auto" />
        <span class="text-blue-600">Administration</span>
      </a>

      <div class="flex justify-center items-center gap-2">
        <a href="/" data-link class="text-xs text-blue-600 transition-colors hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100">
          Voir le site ↗
        </a>

        <button type="button" data-action="theme" aria-label="Changer de thème" class="h-8 rounded-md border border-zinc-200 px-3 text-xs font-medium text-zinc-700 transition-colors hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-800">
          Thème
        </button>

        <button type="button" data-action="deconnexion" class="h-8 rounded-md border border-zinc-200 px-3 text-xs font-medium text-zinc-700 transition-colors hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-800">
          Se déconnecter
        </button>
      </div>
    </div>

    <figcaption class="w-full border-t border-zinc-100 bg-zinc-50/80 px-6 py-2 dark:border-zinc-800 dark:bg-zinc-900/50">
      <!-- Le routeur pose aria-current="page" sur le lien de la page affichée. -->
      <nav class="mx-auto flex max-w-6xl items-center gap-6 overflow-x-auto text-sm">
        <a href="/admin" data-link class="font-medium text-zinc-900 hover:text-blue-600 aria-[current=page]:text-blue-600 dark:text-zinc-100 dark:hover:text-blue-400 dark:aria-[current=page]:text-blue-400">
          Tableau de bord
        </a>
        <slot name="navigation"></slot>
      </nav>
    </figcaption>
  </figure>
</header>
