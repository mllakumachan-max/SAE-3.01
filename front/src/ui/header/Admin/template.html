<header class="sticky top-0 z-10 border-b border-zinc-200 bg-white/95 backdrop-blur-xs dark:border-zinc-800 dark:bg-zinc-950/95">

    <div class="flex items-center gap-6">

      <!-- Le routeur pose aria-current="page" sur le lien de la page affichée. -->

        <a href="/admin" data-link class="text-zinc-500 transition-colors hover:text-zinc-950 aria-[current=page]:font-medium aria-[current=page]:text-zinc-950 dark:text-zinc-400 dark:hover:text-zinc-50 dark:aria-[current=page]:text-zinc-50">
          Tableau de bord
        </a>
        <a href="/admin/produits" data-link class="text-zinc-500 transition-colors hover:text-zinc-950 aria-[current=page]:font-medium aria-[current=page]:text-zinc-950 dark:text-zinc-400 dark:hover:text-zinc-50 dark:aria-[current=page]:text-zinc-50">
          Produits
        </a>
        <a href="/admin/categories" data-link class="text-zinc-500 transition-colors hover:text-zinc-950 aria-[current=page]:font-medium aria-[current=page]:text-zinc-950 dark:text-zinc-400 dark:hover:text-zinc-50 dark:aria-[current=page]:text-zinc-50">

        </a>

      <button type="button" data-action="deconnexion" class="h-8 rounded-md border border-zinc-200 px-3 text-xs font-medium text-zinc-700 transition-colors hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-800">
        Se déconnecter
      </button>

  </div>
