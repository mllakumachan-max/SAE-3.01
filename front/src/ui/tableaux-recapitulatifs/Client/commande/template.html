<section class="mx-auto max-w-3xl rounded-lg border border-zinc-200 bg-white p-6 shadow-xs dark:border-zinc-800 dark:bg-zinc-900">
    <h2 class="mb-1 text-2xl font-semibold tracking-tight text-zinc-950 dark:text-zinc-50">Récapitulatif de ma commande</h2>
    <p class="mb-5 text-sm text-zinc-500 dark:text-zinc-400">Vérifiez votre commande avant de la confirmer.</p>

    <ul data-zone="lignes" class="divide-y divide-zinc-200 dark:divide-zinc-800"></ul>

    <dl class="mt-4 flex flex-col gap-2 border-t border-zinc-200 pt-4 text-sm dark:border-zinc-800">
        <div class="flex justify-between"><dt class="text-zinc-600 dark:text-zinc-400">Mode de retrait</dt><dd data-zone="retrait" class="font-medium text-zinc-900 dark:text-zinc-100"></dd></div>
        <div class="flex justify-between text-base"><dt class="font-semibold text-zinc-950 dark:text-zinc-50">Total</dt><dd data-zone="total" class="font-semibold text-zinc-950 dark:text-zinc-50"></dd></div>
    </dl>

    <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:justify-between">
        <button type="button" data-action="retour" class="h-10 rounded-md border border-zinc-200 px-4 text-sm font-medium text-zinc-700 hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-200 dark:hover:bg-zinc-800">← Retour au panier</button>
        <button type="button" data-action="confirmer" class="h-10 rounded-md bg-zinc-900 px-4 text-sm font-medium text-white hover:opacity-90 dark:bg-zinc-50 dark:text-zinc-900">Confirmer ma commande</button>
    </div>
</section>
