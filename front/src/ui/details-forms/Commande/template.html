<section class="mb-6 rounded-lg border border-zinc-200 bg-white p-6 shadow-xs dark:border-zinc-800 dark:bg-zinc-900">
    <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-2xl font-semibold tracking-tight text-zinc-950 dark:text-zinc-50">Commande n° {{numero}}</h2>
        <span class="rounded-full border border-zinc-200 px-3 py-1 text-sm text-zinc-700 dark:border-zinc-700 dark:text-zinc-200">{{statut}}</span>
    </div>
    <p class="mb-4 text-sm text-zinc-500 dark:text-zinc-400">Passée le {{date}} · Retrait : {{modeRetrait}}</p>

    <ul data-zone="lignes" class="divide-y divide-zinc-200 dark:divide-zinc-800"></ul>

    <div class="mt-4 flex flex-wrap items-center justify-between gap-3 border-t border-zinc-200 pt-4 dark:border-zinc-800">
        <p class="text-lg font-semibold text-zinc-950 dark:text-zinc-50">Total : {{total}}</p>
        <button type="button" data-action="commander-a-nouveau" class="h-10 rounded-md bg-zinc-900 px-4 text-sm font-medium text-white hover:opacity-90 dark:bg-zinc-50 dark:text-zinc-900">Commander à nouveau</button>
    </div>
</section>
