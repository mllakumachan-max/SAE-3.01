<article class="flex flex-col justify-between overflow-hidden rounded-lg border border-zinc-200 bg-white shadow-xs transition-shadow hover:shadow-md dark:border-zinc-800 dark:bg-zinc-900">
  <figure class="flex flex-col">
    <div class="flex h-48 w-full items-center justify-center overflow-hidden bg-zinc-50 p-4 dark:bg-zinc-950">
      <img src="{{src}}" alt="{{alt}}" class="h-full w-full object-contain transition-transform duration-200 hover:scale-105" loading="lazy" />
    </div>

    <figcaption class="flex flex-col p-4">
      <h2 class="mb-1 text-base font-semibold leading-snug tracking-tight text-zinc-900 line-clamp-2 dark:text-zinc-100">
        {{nom}}
      </h2>

      <div class="mb-3 flex items-baseline justify-between gap-2">
        <span class="text-lg font-bold text-zinc-950 dark:text-zinc-50">
          {{prix}} €
        </span>
        <slot name="badge-stock"></slot>
      </div>

      <a href="{{lien}}" data-link class="text-xs font-medium text-blue-600 underline hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300">
        Voir le détail
      </a>

      <button type="button" data-action="ajouter-panier" class="flex h-10 w-full items-center justify-center gap-2 rounded-md bg-zinc-900 px-4 text-sm font-medium text-white transition-opacity hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50 dark:bg-zinc-50 dark:text-zinc-900 dark:hover:opacity-90">
        Ajouter au panier
      </button>
    </figcaption>
  </figure>
</article>
