<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAE301 - Action</title>

    <!--
      Application du thème avant le premier affichage. Script ordinaire et non
      module : le navigateur l'exécute avant de dessiner la page, qui
      n'apparaît donc jamais, même brièvement, dans le mauvais thème.
      Le thème est conservé en localStorage : le serveur n'en a pas besoin.
    -->
    <script>
      try {
        if (localStorage.getItem("theme") === "sombre") {
          document.documentElement.classList.add("theme-dark");
        }
      } catch (e) {
        // localStorage indisponible : on reste en thème clair.
      }
    </script>
    <script type="module" crossorigin src="/~ribatet1/SAE-3.01/Base/assets/index-dNY8g3IQ.js"></script>
    <link rel="stylesheet" crossorigin href="/~ribatet1/SAE-3.01/Base/assets/index-DQ01FiEA.css">
  </head>
  <body class="bg-white text-zinc-950 antialiased dark:bg-zinc-950 dark:text-zinc-50">
    <div id="app"></div>
  </body>
</html>
