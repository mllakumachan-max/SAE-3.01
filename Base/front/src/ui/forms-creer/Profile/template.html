<section class="mb-6 rounded-lg border bg-surface-default p-6 shadow-xs border-border-default c-details-forms-profile">
    <h2 class="mb-4 text-24 font-semibold tracking-tight text-text-primary">Mon profil</h2>
    <form class="flex flex-col gap-4" novalidate>
        <p data-zone="message" role="alert" class="hidden rounded-md border border-status-warning-indicator p-3 text-14 text-status-warning-text"></p>

        <label class="flex flex-col gap-1.5 text-14 font-medium text-text-primary">
        Nom
        <input name="nom" type="text" required value="{{nom}}" class="h-10 rounded-md border bg-surface-default px-3 text-14 font-normal border-border-default text-text-primary" />
        </label>

        <label class="flex flex-col gap-1.5 text-14 font-medium text-text-primary">
        Adresse email
        <input name="email" type="email" required autocomplete="email" value="{{email}}" class="h-10 rounded-md border bg-surface-default px-3 text-14 font-normal border-border-default text-text-primary" />
        </label>

        <fieldset class="flex flex-col gap-4 border-t pt-4 border-border-default">
            <legend class="text-14 text-text-secondary">Changer de mot de passe (facultatif)</legend>
            <label class="flex flex-col gap-1.5 text-14 font-medium text-text-primary">
                Mot de passe actuel
                <input name="mdpActuel" type="password" autocomplete="current-password" class="h-10 rounded-md border bg-surface-default px-3 text-14 font-normal border-border-default text-text-primary" />
            </label>
            <label class="flex flex-col gap-1.5 text-14 font-medium text-text-primary">
                Nouveau mot de passe
                <input name="mdpNouveau" type="password" autocomplete="new-password" class="h-10 rounded-md border bg-surface-default px-3 text-14 font-normal border-border-default text-text-primary" />
            </label>
            <label class="flex flex-col gap-1.5 text-14 font-medium text-text-primary">
                Confirmer le nouveau mot de passe
                <input name="mdpConfirmation" type="password" autocomplete="new-password" class="h-10 rounded-md border bg-surface-default px-3 text-14 font-normal border-border-default text-text-primary" />
            </label>
        </fieldset>

        <button type="submit" class="mt-2 h-10 rounded-md bg-action-primary-background px-4 text-14 font-medium text-action-primary-text hover:opacity-90">Enregistrer</button>
    </form>
</section>
