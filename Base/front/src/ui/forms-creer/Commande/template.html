<section class="mb-6 rounded-lg border bg-surface-default p-6 shadow-xs border-border-default c-details-forms-commande">
    <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-24 font-semibold tracking-tight text-text-primary">Commande n° {{numero}}</h2>
        <span class="rounded-full border px-3 py-1 text-14 text-text-secondary border-border-default">{{statut}}</span>
    </div>
    <p class="mb-4 text-14 text-text-secondary">Passée le {{date}} · Retrait : {{modeRetrait}}</p>

    <ul data-zone="lignes" class="divide-y divide-border-subtle"></ul>

    <div class="mt-4 flex flex-wrap items-center justify-between gap-3 border-t pt-4 border-border-default">
        <p class="text-18 font-semibold text-text-primary">Total : {{total}}</p>
        <button type="button" data-action="commander-a-nouveau" class="h-10 rounded-md bg-action-primary-background px-4 text-14 font-medium text-action-primary-text hover:opacity-90">Commander à nouveau</button>
    </div>
</section>
