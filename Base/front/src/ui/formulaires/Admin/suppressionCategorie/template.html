<section role="dialog" aria-modal="true" aria-labelledby="titre-suppr-categorie" class="mb-6 rounded-lg border border-zinc-200 bg-white p-6 shadow-xs dark:border-zinc-800 dark:bg-zinc-900">
    <h2 id="titre-suppr-categorie" class="mb-2 text-xl font-semibold text-zinc-950 dark:text-zinc-50">Supprimer la catégorie « {{nom}} » ?</h2>
    <p data-zone="info" class="mb-4 text-sm text-zinc-600 dark:text-zinc-300"></p>

    <label data-zone="reaffectation" class="mb-5 flex flex-col gap-1.5 text-sm font-medium text-zinc-900 dark:text-zinc-100">
        Réaffecter ses produits à
        <select name="cible" class="h-10 rounded-md border border-zinc-200 bg-white px-3 text-sm font-normal dark:border-zinc-800 dark:bg-zinc-950 dark:text-zinc-100"></select>
    </label>

    <p data-zone="erreur" role="alert" class="mb-4 hidden text-sm text-red-700 dark:text-red-400"></p>

    <div class="flex justify-end gap-3">
        <button type="button" data-action="fermer" class="h-10 rounded-md border border-zinc-200 px-4 text-sm font-medium text-zinc-700 hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-200 dark:hover:bg-zinc-800">Annuler</button>
        <button type="button" data-action="confirmer" class="h-10 rounded-md bg-red-700 px-4 text-sm font-medium text-white hover:opacity-90 disabled:opacity-40 dark:bg-red-500">Supprimer</button>
    </div>
</section>
