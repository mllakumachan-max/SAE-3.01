<section class="mb-6 rounded-lg border border-zinc-200 bg-white p-6 shadow-xs dark:border-zinc-800 dark:bg-zinc-900">
  <div class="mb-4 flex items-center justify-between">
    <h2 class="text-2xl font-semibold tracking-tight text-zinc-950 dark:text-zinc-50">Connexion client</h2>
    <button type="button" data-action="fermer" aria-label="Fermer" class="flex h-8 w-8 items-center justify-center rounded-md border border-zinc-200 text-zinc-500 transition-colors hover:bg-zinc-100 hover:text-zinc-950 dark:border-zinc-800 dark:text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-zinc-50">
      ✕
    </button>
  </div>
  <p class="mb-5 text-sm text-zinc-500 dark:text-zinc-400">Connectez-vous à votre compte Action pour finaliser votre commande en Click & Collect.</p>

  <form class="flex flex-col gap-4">
    <slot name="message"></slot>

    <label class="flex flex-col gap-1.5 text-sm font-medium text-zinc-900 dark:text-zinc-100">
      Adresse email
      <input name="login" type="email" autocomplete="username" required value="{{login}}" placeholder="votre.email@exemple.fr" class="h-10 rounded-md border border-zinc-200 bg-white px-3 text-sm font-normal text-zinc-900 transition-colors hover:border-zinc-400 focus:border-zinc-950 focus:outline-hidden dark:border-zinc-800 dark:bg-zinc-950 dark:text-zinc-100 dark:hover:border-zinc-600 dark:focus:border-zinc-400" />
    </label>

    <label class="flex flex-col gap-1.5 text-sm font-medium text-zinc-900 dark:text-zinc-100">
      Mot de passe
      <input name="mdp" type="password" autocomplete="current-password" required placeholder="••••••••" class="h-10 rounded-md border border-zinc-200 bg-white px-3 text-sm font-normal text-zinc-900 transition-colors hover:border-zinc-400 focus:border-zinc-950 focus:outline-hidden dark:border-zinc-800 dark:bg-zinc-950 dark:text-zinc-100 dark:hover:border-zinc-600 dark:focus:border-zinc-400" />
    </label>

    <button type="submit" class="mt-2 h-10 w-full rounded-md bg-zinc-900 px-4 text-sm font-medium text-white transition-opacity hover:opacity-90 dark:bg-zinc-50 dark:text-zinc-900 dark:hover:opacity-90">
      Me connecter
    </button>

    <div class="mt-3 flex flex-col items-center gap-2 border-t border-zinc-100 pt-4 text-sm text-zinc-500 dark:border-zinc-800 dark:text-zinc-400">
      <p>
        Pas encore de compte ?
        <button type="button" data-action="basculer-inscription" class="font-medium text-blue-600 underline hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300">
          Créer un compte
        </button>
      </p>

      <button type="button" data-action="retour-panier" class="text-xs text-zinc-500 underline hover:text-zinc-950 dark:text-zinc-400 dark:hover:text-zinc-200">
        ← Retour au panier
      </button>
    </div>
  </form>
</section>
