<header class="sticky top-0 z-10 border-b bg-surface-default shadow-xs border-border-default c-header-client">
  <!-- Ligne principale : Logo, Recherche, Actions utilisateur -->
  <figure class="flex flex-col mx-auto max-w-6xl items-center justify-center w-full gap-5 px-6 py-3.5">
    <div class="flex w-full justify-between items-center">
      <!-- Actions à gauche -->
      <a href="/" data-link class="flex items-center gap-2">
        <img src="{{logo-src}}" alt="Logo de l'application" class="h-5 w-auto" />
        <span class="hidden text-12 font-medium text-text-secondary sm:inline">Click & Collect</span>
      </a>

      <!-- Actions à droite : Thème, Compte, Panier -->
      <div class="flex items-center gap-3">
        <button type="button" data-action="theme" aria-label="Changer de thème" class="flex h-9 items-center justify-center rounded-md border px-3 text-12 font-medium text-text-secondary transition-colors hover:bg-surface-subtle border-border-default">
          <svg class="h-4 w-4 shrink-0" aria-hidden="true">
            <use href="{{icon-theme}}" />
          </svg>
        </button>

        <a href="/compte" data-link class="flex h-9 items-center gap-1.5 rounded-md border px-3 text-12 font-medium text-text-secondary transition-colors hover:bg-surface-subtle border-border-default">
          <svg class="h-4 w-4 shrink-0" aria-hidden="true">
            <use href="#icon-user-circle" />
          </svg>
          <span>Mon compte</span>
        </a>

        <!-- Bouton Panier avec compteur d'articles (CMD-b) -->
        <a href="/panier" data-link class="relative flex h-9 items-center gap-2 rounded-md bg-action-primary-background px-3.5 text-12 font-semibold text-action-primary-text transition-opacity hover:opacity-90">
          <svg class="h-4 w-4 shrink-0" aria-hidden="true">
            <use href="#icon-shopping-bag" />
          </svg>
          <span>Panier</span>
          <span data-role="compteur-panier" class="flex h-5 min-w-5 items-center justify-center rounded-full bg-surface-info px-1 text-12 font-bold text-text-link">
            {{nbArticles}}
          </span>
        </a>
      </div>
    </div>
    <!-- Barre de catégories (DEC-a) -->
    <figcaption class="w-full border-t bg-surface-subtle px-6 py-2 border-border-default">
      <nav class="flex w-full items-center gap-6 overflow-x-auto text-14">
        <a href="/" data-link class="font-medium text-text-primary hover:text-text-link aria-[current=page]:text-text-link">
          Tous les produits
        </a>
        <slot name="categories"></slot>
      </nav>
    </figcaption>

  </figure>
</header>
