<header class="sticky top-0 z-10 border-b border-border-default bg-surface-default/95 backdrop-blur-xs c-header-admin">
  <figure class="flex flex-col mx-auto max-w-6xl items-center justify-between gap-6 px-6 py-3">
    <div class="flex w-full justify-between items-center gap-3">
      <a href="/admin" data-link class="flex items-center gap-2 text-14 font-bold tracking-tight text-text-primary">
        <img src="{{logo-src}}" alt="Logo de l'application" class="h-5 w-auto" />
        <span class="text-text-link">Administration</span>
      </a>

      <div class="flex justify-center items-center gap-2">
        <a href="/" data-link class="text-12 text-text-link transition-colors hover:text-text-primary text-text-secondary">
          Voir le site ↗
        </a>

        <button type="button" data-action="theme" aria-label="Changer de thème" class="flex h-9 items-center justify-center rounded-md border px-3 text-12 font-medium text-text-secondary transition-colors hover:bg-surface-subtle border-border-default">
          <svg class="h-4 w-4 shrink-0" aria-hidden="true">
            <use href="{{icon-theme}}" />
          </svg>
        </button>

        <button type="button" data-action="deconnexion" class="h-8 rounded-md border px-3 text-12 font-medium text-text-secondary transition-colors hover:bg-surface-subtle border-border-default">
          Se déconnecter
        </button>
      </div>
    </div>

    <figcaption data-zone="navigation-authentifie" class="w-full border-t bg-surface-subtle px-6 py-2 border-border-default">
      <!-- Barre de recherche -->
      <slot name="recherche"></slot>
      <!-- Le routeur pose aria-current="page" sur le lien de la page affichée. -->
      <nav class="mx-auto flex max-w-6xl items-center gap-6 overflow-x-auto text-14">
        <a href="/admin" data-link class="font-medium text-text-primary hover:text-text-link aria-[current=page]:text-text-link">
          Tableau de bord
        </a>
        <slot name="navigation"></slot>
      </nav>
    </figcaption>
  </figure>
</header>
