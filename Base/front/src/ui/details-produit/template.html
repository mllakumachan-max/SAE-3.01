<article class="grid gap-8 md:grid-cols-2">
  <ol class="flex justify-start items-center gap-5">
    <li>
      <slot name="lien-retour-catalogue"></slot>
    </li>
    <li>
      <slot name="lien-retour-categorie"></slot>
    </li>
  </ol>

  <figure class="flex flex-col gap-3">
    <slot name="galerie"></slot>
    <figcaption class="flex flex-col gap-5">
      <div class="flex items-start justify-between gap-4">
        <h1 class="text-3xl font-semibold tracking-tight text-zinc-950 dark:text-zinc-50">{{nom}}</h1>
        <slot name="badge-stock"></slot>
      </div>
      <p class="text-2xl font-bold text-zinc-950 dark:text-zinc-50">{{prix}} €</p>

      <p class="text-sm leading-relaxed text-zinc-600 dark:text-zinc-300">{{description}}</p>

      <div data-zone="options"></div>

      <label class="flex flex-col gap-1.5 text-sm font-medium text-zinc-900 dark:text-zinc-100">
        Quantité
        <slot name="quantite"></slot>
      </label>

      <button type="button" data-action="ajouter-panier" class="flex h-11 w-full items-center justify-center rounded-md bg-zinc-900 px-4 text-sm font-medium text-white transition-opacity hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50 dark:bg-zinc-50 dark:text-zinc-900">
        Ajouter au panier
      </button>
    </figcaption>
  </figure>
</article>
