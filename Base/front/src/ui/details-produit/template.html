<article class="flex flex-col gap-5 c-details-produit">
  <ol class="flex justify-start items-center gap-5">
    <li>
      <slot name="lien-retour-catalogue"></slot>
    </li>
    <li>
      <slot name="lien-retour-categorie"></slot>
    </li>
  </ol>

  <figure class="flex flex-col gap-5 lg:flex-row">
    <slot name="galerie"></slot>
    <figcaption class="flex flex-col gap-5">
      <div class="flex items-start justify-between gap-4">
        <h1 class="text-30 font-semibold tracking-tight text-text-primary">{{nom}}</h1>
        <slot name="badge-stock"></slot>
      </div>
      <p class="text-24 font-bold text-text-primary">{{prix}} €</p>

      <p class="text-14 leading-relaxed text-text-secondary">{{description}}</p>

      <div data-zone="options"></div>

      <label class="flex flex-col gap-1.5 text-14 font-medium text-text-primary">
        Quantité
        <slot name="quantite"></slot>
      </label>

      <button type="button" data-action="ajouter-panier" class="flex h-11 w-full items-center justify-center rounded-md bg-action-primary-background px-4 text-14 font-medium text-action-primary-text transition-opacity hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50">
        Ajouter au panier
      </button>
    </figcaption>
  </figure>
</article>
