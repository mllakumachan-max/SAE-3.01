<div class="mb-6 flex flex-wrap items-end gap-4 rounded-lg border p-4 border-border-default c-barre-outils">
  <label class="flex flex-col gap-2 text-14 font-medium">
    Trier par
    <select name="tri" class="h-9 min-w-44 rounded-md border bg-surface-default px-3 font-normal transition-colors hover:border-border-default border-border-default">
      <option value="nom">Nom (A → Z)</option>
      <option value="prix">Prix (croissant)</option>
    </select>
  </label>

  <label class="flex flex-col gap-2 text-14 font-medium">
    Produits par page
    <select name="parPage" class="h-9 min-w-44 rounded-md border bg-surface-default px-3 font-normal transition-colors hover:border-border-default border-border-default">
      <option value="12">12 produits</option>
      <option value="24">24 produits</option>
      <option value="48">48 produits</option>
    </select>
  </label>

  <span class="ml-auto text-14 text-text-secondary">{{total}} produits</span>
</div>
