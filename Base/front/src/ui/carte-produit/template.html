<article class="flex flex-col justify-between overflow-hidden rounded-lg border bg-surface-default shadow-xs transition-shadow hover:shadow-md border-border-default c-carte-produit">
  <a href="{{lien}}" data-link class="flex flex-1 flex-col text-inherit no-underline">
    <figure class="flex flex-1 flex-col">
      <div class="flex h-48 w-full items-center justify-center overflow-hidden bg-surface-subtle p-4">
        <img src="{{src}}" alt="{{alt}}" class="h-full w-full object-contain text-text-primary transition-transform duration-200 hover:scale-105" loading="lazy" />
      </div>

      <figcaption class="flex flex-col p-4 gap-5">
        <h2 class="mb-1 min-h-[2.75em] overflow-hidden text-16 font-semibold leading-snug tracking-tight text-text-primary line-clamp-2">
          {{nom}}
        </h2>

        <div class="mb-3 flex items-baseline justify-between gap-2">
          <span class="text-18 font-bold text-text-primary">
            {{prix}} €
          </span>
          <slot name="badge-stock"></slot>
        </div>
      </figcaption>
    </figure>
  </a>
  <div class="px-4 pb-4">
    <button type="button" data-action="ajouter-panier" class="flex h-10 w-full items-center justify-center gap-2 rounded-md bg-action-primary-background px-4 text-14 font-medium text-action-primary-text transition-opacity hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50">
      Ajouter au panier
    </button>
  </div>
</article>
