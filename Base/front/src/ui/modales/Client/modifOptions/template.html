<section class="mb-6 rounded-lg border bg-surface-default p-6 shadow-xs border-border-default c-formulaires-client-modifoptions">
  <div class="mb-4 flex items-center justify-between">
    <h2 class="text-24 font-semibold tracking-tight text-text-primary">Modifier les options</h2>
    <button type="button" data-action="fermer" aria-label="Fermer" class="flex h-8 w-8 items-center justify-center rounded-md border text-text-secondary hover:bg-surface-subtle border-border-default">
      <svg class="h-4 w-4 shrink-0" aria-hidden="true">
        <use href="#icon-x" />
      </svg>
    </button>
  </div>
  <p class="mb-5 text-14 text-text-secondary">{{nom}}</p>

  <form class="flex flex-col gap-4">
    <div data-zone="message"></div>
    <div data-zone="options" class="flex flex-col gap-4"></div>

    <div class="mt-2 flex justify-end gap-3">
      <button type="button" data-action="fermer" class="h-10 rounded-md border px-4 text-14 font-medium text-text-secondary hover:bg-surface-subtle border-border-default">
        Annuler
      </button>
      <button type="submit" class="h-10 rounded-md bg-action-primary-background px-4 text-14 font-medium text-action-primary-text hover:opacity-90">
        Enregistrer
      </button>
    </div>
  </form>
</section>
