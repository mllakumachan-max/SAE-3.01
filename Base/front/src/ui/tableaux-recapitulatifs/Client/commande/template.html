<section class="mx-auto max-w-3xl rounded-lg border bg-surface-default p-6 shadow-xs border-border-default c-tableaux-recapitulatifs-client-commande">
    <h2 class="mb-1 text-24 font-semibold tracking-tight text-text-primary">Récapitulatif de ma commande</h2>
    <p class="mb-5 text-14 text-text-secondary">Vérifiez votre commande avant de la confirmer.</p>

    <ul data-zone="lignes" class="divide-y divide-border-subtle"></ul>

    <dl class="mt-4 flex flex-col gap-2 border-t pt-4 text-14 border-border-default">
        <div class="flex justify-between"><dt class="text-text-secondary">Mode de retrait</dt><dd data-zone="retrait" class="font-medium text-text-primary"></dd></div>
        <div class="flex justify-between text-16"><dt class="font-semibold text-text-primary">Total</dt><dd data-zone="total" class="font-semibold text-text-primary"></dd></div>
    </dl>

    <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:justify-between">
        <button type="button" data-action="retour" class="h-10 rounded-md border px-4 text-14 font-medium text-text-secondary hover:bg-surface-subtle border-border-default">← Retour au panier</button>
        <button type="button" data-action="confirmer" class="h-10 rounded-md bg-action-primary-background px-4 text-14 font-medium text-action-primary-text hover:opacity-90">Confirmer ma commande</button>
    </div>
</section>
